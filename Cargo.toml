[package]
name = "bp-carnet"
version = "0.1.0"
edition = "2024"

# ADR: デバッグ情報を行番号表だけに絞る。target/debug の大半 (実測 20G のうち deps 15G) が
# デバッグ情報で、ディスクを圧迫していた。バックトレースの行番号は残り、テストの失敗箇所は
# 追える。デバッガでの変数検査が要るときだけ一時的に debug = true に戻す。
[profile.dev]
debug = "line-tables-only"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11"
csv = "1.3.1"
directories = "6.0.0"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
# TLS は reqwest と揃えて rustls にする (OpenSSL へのリンクを増やさないため)。
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
mime_guess = "2.0.5"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rpassword = "7.5.4"
# include-exclude: 埋め込むファイルを絞る `#[exclude]` 属性 (src/static_files.rs 参照)。
rust-embed = { version = "8.12.0", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "macros",
    "signal",
] }
toml = "1.1.5"
tower-http = { version = "0.7.1", features = ["compression-gzip", "cors", "trace"] }
tower-sessions = { version = "0.14", default-features = false, features = [
    "axum-core",
    "signed",
] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-general-category = "1.1.0"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
