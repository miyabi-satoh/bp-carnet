<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
	<!-- ログイン画面のマーク。色は layout.css の secondary と
	     secondary-foreground。16px でも潰れないよう、水滴を大きく線を太くしてある。
	     XML のコメントには連続したハイフンを書けない (SVG ごと読み込めなくなる)。 -->
	<style>
		.bg { fill: #d2eef0; }
		.fg { stroke: #00666c; }
		@media (prefers-color-scheme: dark) {
			.bg { fill: #083a3d; }
			.fg { stroke: #64d1d7; }
		}
	</style>
	<circle class="bg" cx="12" cy="12" r="12" />
	<path
		class="fg"
		transform="translate(12 12) scale(0.62) translate(-12 -12)"
		fill="none"
		stroke-width="3.2"
		stroke-linecap="round"
		stroke-linejoin="round"
		d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"
	/>
</svg>
